[project]
name = "chrono-lens-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "Pillow>=10",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
gpu = [
    "diffusers>=0.27",
    "transformers>=4.40",
    "accelerate>=0.29",
    "xformers>=0.0.25",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.uv]
# torch はCUDA版を使うため別途インストール
# uv pip install torch --index-url https://download.pytorch.org/whl/cu121

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
